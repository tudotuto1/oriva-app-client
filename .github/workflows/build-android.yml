name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'oriva-app-client/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    name: Build APK (release, debug-signed)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./oriva-app-client

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17 (required by Android Gradle plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.32.0'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Generate native Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            echo "android/ folder missing, generating with flutter create..."
            flutter create --platforms=android --org=com.oriva .
            echo "android/ folder generated."
          else
            echo "android/ folder already exists, skipping generation."
          fi

      - name: Generate launcher icons (Oriva shopping bag)
        run: dart run flutter_launcher_icons

      - name: Create .env file from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oriva-android-apk-${{ github.sha }}
          path: oriva-app-client/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Show APK size
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk
